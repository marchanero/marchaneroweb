[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!.github'"

[build.environment]
  NODE_VERSION = "20"

# Astro ya empaqueta, minifica y versiona (hash) CSS/JS, y procesa las imágenes
# vía <Image>. El post-procesado legacy de Netlify es redundante y además
# reescribe el Cache-Control de los assets a "max-age=0, must-revalidate",
# ignorando la cabecera immutable de más abajo. Se desactiva por completo.
[build.processing]
  skip_processing = true

# Nota: no hay redirect catch-all a /index.html. Es un sitio multipágina de
# Astro (build.format 'directory'); Netlify sirve cada /ruta/ y devuelve el
# 404.html generado para lo que no exista.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # El hash sha256 autoriza el único <script> inline: el anti-FOUC de tema en
    # Layout.astro. Si cambias ese script, recalcula el hash.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self' 'sha256-bsed567imVaqE/ieW0FhkWoWFup2YfOFta4KNCz4daU='; frame-src 'none'"

# Assets con hash en el nombre (JS/CSS/fuentes/imágenes de _astro): son
# inmutables, cualquier cambio de contenido genera un fichero nuevo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras para el panel del CMS (Sveltia)
# CSP recomendada: https://sveltiacms.app/en/docs/security
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; connect-src 'self' blob: data: https://unpkg.com https://api.github.com https://www.githubstatus.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' blob: data: https://*.githubusercontent.com; media-src blob:; frame-src blob:; manifest-src blob:"
