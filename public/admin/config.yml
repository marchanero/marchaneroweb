# Configuración de Sveltia CMS
# Documentación: https://sveltiacms.app/en/docs

backend:
  name: github
  repo: marchanero/marchaneroweb
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" via CMS'
    update: 'Update {{collection}} "{{slug}}" via CMS'
    delete: 'Delete {{collection}} "{{slug}}" via CMS'

# Imágenes subidas desde el CMS
media_folder: public/images/uploads
public_folder: /images/uploads

locale: es

site_url: https://marchanero.netlify.app
logo_url: https://marchanero.netlify.app/favicon.svg

collections:
  # -----------------------------------------------------------
  # Página de inicio (archivo único JSON)
  # -----------------------------------------------------------
  - name: 'home'
    label: 'Página de inicio'
    files:
      - name: 'home'
        label: 'Contenido de la home'
        file: 'content/home.json'
        fields:
          - { label: 'Título de la sección', name: 'introTitulo', widget: 'string' }
          - { label: 'Texto de presentación', name: 'introTexto', widget: 'text' }
          - label: 'Líneas de investigación'
            name: 'researchLines'
            widget: 'list'
            field: { label: 'Línea', name: 'linea', widget: 'string' }

  # -----------------------------------------------------------
  # Proyectos de investigación (un .md por proyecto)
  # -----------------------------------------------------------
  - name: 'proyectos'
    label: 'Proyectos'
    label_singular: 'Proyecto'
    folder: 'content/proyectos'
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{titulo}} · {{estado}}'
    sortable_fields: ['titulo', 'fechaInicio', 'estado']
    fields:
      - { label: 'Título', name: 'titulo', widget: 'string' }
      - { label: 'Etiqueta para la home (p. ej. IA · EDUCACIÓN)', name: 'tag', widget: 'string', required: false }
      - label: 'Etiquetas'
        name: 'etiquetas'
        widget: 'list'
        field: { label: 'Etiqueta', name: 'etiqueta', widget: 'string' }
      - { label: 'Descripción', name: 'descripcion', widget: 'text' }
      - { label: 'Año de inicio', name: 'fechaInicio', widget: 'string' }
      - { label: 'Año de fin (o "Actualidad")', name: 'fechaFin', widget: 'string' }
      - label: 'Estado'
        name: 'estado'
        widget: 'select'
        options: ['En curso', 'Finalizado']
        default: 'En curso'
      - { label: 'Financiación', name: 'financiacion', widget: 'string', required: false }
      - { label: 'Presupuesto', name: 'presupuesto', widget: 'string', required: false }
      - { label: 'URL de detalle', name: 'url', widget: 'string', required: false }
      - { label: 'Repositorio GitHub', name: 'github', widget: 'string', required: false }
      - { label: 'Destacado en página Proyectos', name: 'destacado', widget: 'boolean', default: false }
      - { label: 'Destacado en la home', name: 'destacadoHome', widget: 'boolean', default: false }
      - { label: 'Progreso (%)', name: 'progreso', widget: 'number', min: 0, max: 100, default: 0, value_type: 'int' }
      - label: 'Resultados'
        name: 'resultados'
        widget: 'list'
        required: false
        field: { label: 'Resultado', name: 'resultado', widget: 'string' }
      - { label: 'Contenido adicional', name: 'body', widget: 'markdown', required: false }

  # -----------------------------------------------------------
  # Cuartiles JCR/SJR de publicaciones (archivo único JSON)
  # No hay API pública gratuita de Clarivate/FECYT: se mantiene a mano,
  # emparejado por título con las publicaciones sincronizadas de Google Scholar.
  # -----------------------------------------------------------
  - name: 'publicaciones-cuartiles'
    label: 'Cuartiles de publicaciones'
    files:
      - name: 'cuartiles'
        label: 'Cuartiles JCR/SJR'
        file: 'content/publicaciones-cuartiles.json'
        fields:
          - label: 'Publicaciones'
            name: 'cuartiles'
            widget: 'list'
            summary: '{{cuartil}} · {{titulo}}'
            fields:
              - { label: 'Título exacto (tal cual en Google Scholar)', name: 'titulo', widget: 'string' }
              - { label: 'Cuartil (p. ej. Q1, D1/Q1)', name: 'cuartil', widget: 'string' }
              - { label: 'Posición (p. ej. 21/145)', name: 'posicion', widget: 'string', required: false }
              - { label: 'Categoría JCR/SJR', name: 'categoria', widget: 'string', required: false }
              - { label: 'Factor de impacto', name: 'impactFactor', widget: 'number', required: false }

  # -----------------------------------------------------------
  # Currículum vitae (archivo único JSON)
  # -----------------------------------------------------------
  - name: 'cv'
    label: 'Currículum vitae'
    files:
      - name: 'cv'
        label: 'Contenido del CV'
        file: 'content/cv.json'
        fields:
          - label: 'Formación académica'
            name: 'educacion'
            widget: 'list'
            summary: '{{titulo}}'
            fields:
              - { label: 'Título', name: 'titulo', widget: 'string' }
              - { label: 'Institución', name: 'institucion', widget: 'string' }
              - { label: 'Periodo (p. ej. 2015 - 2019)', name: 'periodo', widget: 'string', required: false }
              - { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
          - label: 'Experiencia profesional'
            name: 'experienciaProfesional'
            widget: 'list'
            required: false
            summary: '{{puesto}}'
            fields:
              - { label: 'Puesto / actividad', name: 'puesto', widget: 'string' }
              - { label: 'Entidad', name: 'entidad', widget: 'string' }
              - { label: 'Periodo (p. ej. 2017 - 2018)', name: 'periodo', widget: 'string' }
              - { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
          - label: 'Experiencia docente'
            name: 'experienciaDocente'
            widget: 'list'
            required: false
            summary: '{{puesto}}'
            fields:
              - { label: 'Puesto', name: 'puesto', widget: 'string' }
              - { label: 'Departamento', name: 'departamento', widget: 'string' }
              - { label: 'Universidad', name: 'universidad', widget: 'string' }
              - { label: 'Periodo (p. ej. 2021 - Actualidad)', name: 'periodo', widget: 'string' }
              - label: 'Asignaturas impartidas'
                name: 'asignaturas'
                widget: 'list'
                field: { label: 'Asignatura', name: 'asignatura', widget: 'string' }
          - label: 'Experiencia investigadora'
            name: 'experienciaInvestigadora'
            widget: 'list'
            required: false
            summary: '{{proyecto}}'
            fields:
              - { label: 'Puesto (p. ej. Investigador Principal)', name: 'puesto', widget: 'string' }
              - { label: 'Proyecto', name: 'proyecto', widget: 'string' }
              - { label: 'Entidad financiadora', name: 'entidad', widget: 'string' }
              - { label: 'Periodo', name: 'periodo', widget: 'string' }
              - { label: 'Código de proyecto', name: 'codigo', widget: 'string', required: false }
              - { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
          - label: 'Estancias de investigación'
            name: 'estancias'
            widget: 'list'
            required: false
            summary: '{{centro}}'
            fields:
              - { label: 'Centro', name: 'centro', widget: 'string' }
              - { label: 'Departamento', name: 'departamento', widget: 'string', required: false }
              - { label: 'País', name: 'pais', widget: 'string' }
              - { label: 'Periodo (año)', name: 'periodo', widget: 'string' }
              - { label: 'Duración', name: 'duracion', widget: 'string', required: false }
              - { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
          - label: 'Gestión académica'
            name: 'gestionAcademica'
            widget: 'list'
            required: false
            summary: '{{cargo}}'
            fields:
              - { label: 'Cargo', name: 'cargo', widget: 'string' }
              - { label: 'Institución', name: 'institucion', widget: 'string' }
              - { label: 'Periodo (p. ej. 2025 - Actualidad)', name: 'periodo', widget: 'string' }
              - { label: 'Descripción', name: 'descripcion', widget: 'text', required: false }
          - label: 'Reconocimientos'
            name: 'reconocimientos'
            widget: 'list'
            required: false
            summary: '{{titulo}}'
            fields:
              - { label: 'Título', name: 'titulo', widget: 'string' }
              - { label: 'Entidad', name: 'entidad', widget: 'string' }
              - { label: 'Año', name: 'anio', widget: 'number', value_type: 'int' }

  # -----------------------------------------------------------
  # Asignaturas (un .md por asignatura)
  # -----------------------------------------------------------
  - name: 'asignaturas'
    label: 'Asignaturas'
    label_singular: 'Asignatura'
    folder: 'content/asignaturas'
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{titulo}} · {{codigo}}'
    sortable_fields: ['titulo', 'codigo', 'curso']
    fields:
      - { label: 'Código', name: 'codigo', widget: 'string' }
      - { label: 'Título', name: 'titulo', widget: 'string' }
      - { label: 'Grado', name: 'grado', widget: 'string' }
      - label: 'Nivel'
        name: 'nivel'
        widget: 'select'
        options: ['grado', 'master', 'doctorado']
        default: 'grado'
      - { label: 'Curso (p. ej. 1º)', name: 'curso', widget: 'string' }
      - { label: 'Cuatrimestre (p. ej. 1º)', name: 'cuatrimestre', widget: 'string' }
      - { label: 'Créditos ECTS', name: 'creditos', widget: 'number', default: 6, value_type: 'int' }
      - label: 'Cursos académicos impartidos (p. ej. 2024-2025) — uno por cada curso en que se ha dado, más reciente primero'
        name: 'academicYear'
        widget: 'list'
        field: { label: 'Curso académico', name: 'anio', widget: 'string' }
      - { label: 'Descripción', name: 'descripcion', widget: 'text' }
      - label: 'Temario'
        name: 'temario'
        widget: 'list'
        field: { label: 'Tema', name: 'tema', widget: 'string' }
      - { label: 'Horario', name: 'horario', widget: 'string', default: 'Por definir', required: false }
      - { label: 'Enlace a materiales', name: 'enlaceMateriales', widget: 'string', required: false }
      - { label: 'Destacada', name: 'destacada', widget: 'boolean', default: false }
      - { label: 'Contenido adicional', name: 'body', widget: 'markdown', required: false }
